<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ site.description }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ site.description }}">
<meta property="og:image" content="{{ '/assets/img/lab_0826.jpeg' | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

<header class="site-header">
  <div class="brand">
    <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <span class="affil">{{ site.affiliation }}</span>
  </div>
  <nav>
    <a href="#people">People</a>
    <a href="#papers">Papers</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<main>
{{ content }}
</main>

<footer class="site-footer">
  <span>{{ site.title }} · {{ site.department }} · {{ site.affiliation }}</span>
  <span>Updated {{ site.time | date: "%B %Y" }}</span>
</footer>

</body>
</html>
